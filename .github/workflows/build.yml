name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      # Caches Gradle, its downloads and Loom's Minecraft jars between runs.
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      # Starts a server with the mod: it fails if any data pack file doesn't load, as a world would.
      - name: game tests
        run: ./gradlew runGametest
      - name: capture mod jar
        uses: actions/upload-artifact@v7
        with:
          name: dynamic-cooking-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      # Every push to main also becomes a pre-release, so the jar can be downloaded from the Releases page.
      - name: publish dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar')
          gh release create "build-${{ github.run_number }}" "$jar" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Dev build ${{ github.run_number }}" \
            --notes "Automatic build of ${{ github.sha }}. Drop the jar in your mods folder along with Fabric API for 26.3."
      # The first main build of a new version in gradle.properties also becomes a full release, tagged v<version>, with
      # that version's changelog entry as its notes.
      - name: publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar')
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md
          gh release create "v$version" "$jar" \
            --target "${{ github.sha }}" \
            --latest \
            --title "Dynamic Cooking $version" \
            --notes-file notes.md
