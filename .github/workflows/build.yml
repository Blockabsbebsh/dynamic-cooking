name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture mod jar
        uses: actions/upload-artifact@v7
        with:
          name: dynamic-cooking-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      # Every push to main also becomes a pre-release, so the jar can be downloaded from the Releases page.
      - name: publish dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar')
          gh release create "build-${{ github.run_number }}" "$jar" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Dev build ${{ github.run_number }}" \
            --notes "Automatic build of ${{ github.sha }}. Drop the jar in your mods folder along with Fabric API for 26.3."
