name: probe
on: push
jobs:
  probe:
    if: github.ref == 'refs/heads/claude/project-thread-fh5phc'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew compileJava -q || true
      - run: |
          for j in $(find ~/.gradle .gradle -name '*.jar' 2>/dev/null | grep -i minecraft); do
            if unzip -l "$j" | grep -q 'net/minecraft/world/item/crafting/SmeltingRecipe.class'; then MC="$j"; fi
            if unzip -l "$j" | grep -q 'net/minecraft/client/gui/screens/inventory/BookViewScreen.class'; then CL="$j"; fi
          done
          echo "MC=$MC CL=$CL"
          javap -cp "$MC" -p net.minecraft.world.item.crafting.AbstractCookingRecipe net.minecraft.world.item.crafting.SmeltingRecipe net.minecraft.world.item.crafting.SmokingRecipe net.minecraft.world.item.crafting.CampfireCookingRecipe net.minecraft.world.item.crafting.SingleItemRecipe net.minecraft.world.item.crafting.SingleRecipeInput net.minecraft.world.item.crafting.RecipeSerializer net.minecraft.world.item.crafting.CookingBookCategory 'net.minecraft.world.item.crafting.AbstractCookingRecipe$Factory' 'net.minecraft.world.item.crafting.Recipe' 'net.minecraft.world.item.crafting.Recipe$CommonInfo' 'net.minecraft.world.item.crafting.AbstractCookingRecipe$CookingBookInfo' 'net.minecraft.world.item.crafting.SingleItemRecipe$Serializer' net.minecraft.world.item.ItemStackTemplate 2>&1
          javap -cp "$MC" -p net.minecraft.world.level.block.entity.CampfireBlockEntity | grep -i cook
          javap -cp "$MC" -p net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity | grep -i -E "burn|recipe"
          javap -cp "$CL:$MC" -p net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.screens.inventory.BookViewScreen 2>&1
          javap -cp "$CL:$MC" -p net.minecraft.client.gui.GuiGraphics 2>&1 | head -150
          javap -cp "$CL:$MC" -p net.minecraft.client.gui.GuiGraphicsExtractor 2>&1 | head -150
          javap -cp "$CL:$MC" -p net.minecraft.client.Minecraft | grep -i -E "setScreen|getInstance"
          javap -cp "$CL:$MC" -p net.minecraft.client.gui.components.Button 'net.minecraft.client.gui.components.Button$Builder' 'net.minecraft.client.gui.components.Renderable' 2>&1 | head -60
